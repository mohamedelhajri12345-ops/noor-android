<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>NOOR YouTube & MP4 Player</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: #000; width: 100%; height: 100%;
    overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  #player-container {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #000; display: flex; align-items: center; justify-content: center;
  }
  #player { width: 100%; height: 100%; border: none; }
  iframe { width: 100%; height: 100%; border: none; pointer-events: none; }
  #native-video { width: 100%; height: 100%; background: #000; object-fit: contain; }
</style>
</head>
<body>
<div id="player-container"><div id="player"></div></div>
<script>
  // NOOR Embedded Privacy Player (youtube-nocookie.com & HTML5 native MP4)
  var player = null;
  var nativeVideo = null;
  var mode = 'yt';
  var currentId = null;
  var pendingId = null;
  var apiReady = false;
  var progressTimer = null;
  var currentRate = 1;

  function qs(name) {
    var m = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : null;
  }

  function report(title) { document.title = title; }

  function bridge(fn) {
    try {
      if (window.AndroidBridge && window.AndroidBridge[fn]) {
        window.AndroidBridge[fn]();
      }
    } catch (e) {}
  }

  function bridgeState(state) {
    try {
      if (window.AndroidBridge) {
        if (window.AndroidBridge.sendState) window.AndroidBridge.sendState(state);
        if (window.AndroidBridge.sendStateChange) window.AndroidBridge.sendStateChange(state);
      }
    } catch (e) {}
  }

  function bridgeProgress(t, d, playing) {
    try {
      if (window.AndroidBridge && window.AndroidBridge.sendProgress) {
        window.AndroidBridge.sendProgress(t, d, !!playing);
      }
    } catch (e) {}
  }

  function bridgeError(code) {
    report('ERROR' + code);
    try {
      if (window.AndroidBridge && window.AndroidBridge.sendVideoError) {
        window.AndroidBridge.sendVideoError(code);
      }
    } catch (e) {}
  }

  // ---------------- MP4 (native) mode ----------------
  function setupNative(src) {
    mode = 'mp4';
    report('LOADING');
    var container = document.getElementById('player');
    container.innerHTML = '';
    nativeVideo = document.createElement('video');
    nativeVideo.id = 'native-video';
    nativeVideo.src = src;
    nativeVideo.playsInline = true;
    nativeVideo.setAttribute('playsinline', '');
    nativeVideo.setAttribute('webkit-playsinline', '');
    nativeVideo.preload = 'auto';

    nativeVideo.onloadedmetadata = function () { report('READY'); bridge('sendPlayerReady'); };
    nativeVideo.oncanplay = function () { report('READY'); bridge('sendPlayerReady'); };
    nativeVideo.onplay = function () { report('PLAYING'); bridgeState(1); };
    nativeVideo.onpause = function () { report('PAUSED'); bridgeState(2); };
    nativeVideo.onended = function () { bridgeState(0); bridge('sendVideoEnded'); };
    nativeVideo.onerror = function () { bridgeError(101); };

    container.appendChild(nativeVideo);

    if (progressTimer) clearInterval(progressTimer);
    progressTimer = setInterval(function () {
      if (!nativeVideo || nativeVideo.readyState < 1) return;
      bridgeProgress(nativeVideo.currentTime || 0, nativeVideo.duration || 0, !nativeVideo.paused);
    }, 500);

    nativeVideo.play().catch(function () { /* autoplay policy */ });
  }

  // ---------------- YouTube Mode (youtube-nocookie.com) ----------------
  function createYouTubePlayer(vId) {
    mode = 'yt';
    currentId = vId;
    report('LOADING');

    if (player && typeof player.destroy === 'function') {
      try { player.destroy(); } catch (e) {}
    }

    player = new YT.Player('player', {
      videoId: vId,
      host: 'https://www.youtube-nocookie.com',
      playerVars: {
        autoplay: 1,
        controls: 0,        // NO YouTube controls — use NOOR gold controls
        rel: 0,             // ZERO suggested videos from external channels
        modestbranding: 1,
        playsinline: 1,
        fs: 0,
        iv_load_policy: 3,
        disablekb: 1,
        cc_load_policy: 0,
        origin: 'https://www.youtube-nocookie.com',
        enablejsapi: 1
      },
      events: {
        onReady: onYTReady,
        onStateChange: onYTStateChange,
        onError: onYTError
      }
    });
  }

  function onYTReady(e) {
    apiReady = true;
    report('READY');
    bridge('sendPlayerReady');
    try {
      if (currentRate) player.setPlaybackRate(currentRate);
      player.playVideo();
    } catch (err) {}
    startProgressTimer();
  }

  function onYTStateChange(e) {
    // 1 PLAYING, 2 PAUSED, 0 ENDED, 3 BUFFERING
    if (e.data === 1) report('PLAYING');
    else if (e.data === 2) report('PAUSED');
    bridgeState(e.data);
    if (e.data === 0) {
      bridge('sendVideoEnded');
    }
  }

  function onYTError(e) {
    bridgeError(e.data || 101);
  }

  function startProgressTimer() {
    if (progressTimer) clearInterval(progressTimer);
    progressTimer = setInterval(function () {
      if (mode !== 'yt' || !player || !player.getCurrentTime) return;
      try {
        var t = player.getCurrentTime() || 0;
        var d = player.getDuration() || 0;
        bridgeProgress(t, d, true);
      } catch (err) {}
    }, 500);
  }

  window.onYouTubeIframeAPIReady = function () {
    apiReady = true;
    var targetId = pendingId || currentId || qs('v') || 'aLF_-NCXao0';
    if (mode === 'yt') {
      createYouTubePlayer(targetId);
    }
  };

  // ---------------- Android JS Interface Controls ----------------
  function playVideo() {
    if (mode === 'mp4') {
      if (nativeVideo) nativeVideo.play().catch(function(){});
      report('PLAYING');
      return;
    }
    if (player && player.playVideo) {
      player.playVideo();
      report('PLAYING');
    }
  }

  function pauseVideo() {
    if (mode === 'mp4') {
      if (nativeVideo) nativeVideo.pause();
      report('PAUSED');
      return;
    }
    if (player && player.pauseVideo) {
      player.pauseVideo();
      report('PAUSED');
    }
  }

  function seekTo(t) {
    if (mode === 'mp4') {
      if (nativeVideo) nativeVideo.currentTime = t;
      return;
    }
    if (player && player.seekTo) {
      player.seekTo(t, true);
    }
  }

  function setRate(r) {
    currentRate = r;
    if (mode === 'mp4') {
      if (nativeVideo) nativeVideo.playbackRate = r;
      return;
    }
    if (player && player.setPlaybackRate) {
      player.setPlaybackRate(r);
    }
  }

  function loadNewVideo(id, src) {
    if (src) {
      setupNative(src);
      return;
    }
    mode = 'yt';
    if (apiReady && player && player.loadVideoById) {
      currentId = id;
      player.loadVideoById(id);
      try { if (currentRate) player.setPlaybackRate(currentRate); } catch (e) {}
      report('LOADING');
    } else {
      pendingId = id;
      createYouTubePlayer(id);
    }
  }

  // ---------------- Initialization ----------------
  var initialSrc = qs('src');
  var initialMode = qs('mode');
  var initialV = qs('v');

  if (initialMode === 'mp4' || initialSrc) {
    setupNative(initialSrc);
  } else {
    currentId = initialV || 'aLF_-NCXao0';
    var tag = document.createElement('script');
    tag.src = 'https://www.youtube-nocookie.com/iframe_api';
    document.head.appendChild(tag);
  }
</script>
</body>
</html>
