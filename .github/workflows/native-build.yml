name: Build NOOR Native App
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web assets (vite)
        env:
          VITE_BASE44_APP_ID: 6a9ec57e3a8cd5ed957a8641
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Sync web assets into native shell
        run: npx cap sync android
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug -x lint
      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk noor-native.apk
          gh release create v3.0 noor-native.apk --title "NOOR Original v3.0" --notes "NOOR app built from the original source code itself, packaged as an installable Android app" || gh release upload v3.0 noor-native.apk --clobber
