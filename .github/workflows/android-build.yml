name: Build NOOR APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ═══ مفتاح توقيع ثابت — يُولَّد مرة واحدة فقط، ثم يُحفظ في المستودع ═══
      # هذا يضمن أن كل نسخة قادمة موقّعة بنفس المفتاح، فلا يفشل التثبيت أبداً
      # عند تحديث التطبيق فوق نسخة قديمة (خطأ "signatures do not match").
      - name: Ensure signing keystore exists
        run: |
          if [ ! -f app/noor-release.keystore ]; then
            echo "لا يوجد مفتاح توقيع — يتم توليد مفتاح ثابت جديد الآن..."
            keytool -genkeypair -v \
              -keystore app/noor-release.keystore \
              -alias noorkey \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass NoorSecure2026 -keypass NoorSecure2026 \
              -dname "CN=NOOR, OU=NOOR, O=ElHajri, L=Casablanca, S=Casablanca, C=MA"
            git config user.name "NOOR CI"
            git config user.email "ci@noor.local"
            git add app/noor-release.keystore
            git commit -m "إضافة مفتاح التوقيع الثابت (يُستعمل في كل الإصدارات القادمة)"
            git push
          else
            echo "مفتاح التوقيع موجود — سيُستعمل لتوقيع هذا الإصدار."
          fi

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK (signed with the stable key)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: gradle assembleDebug --no-daemon --stacktrace -PGEMINI_API_KEY="$GEMINI_API_KEY"

      - name: Read version name
        id: ver
        run: |
          VNAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "name=v$VNAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOOR-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.name }}"
          APK_NAME="noor-${TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK_NAME" --title "القرآن الكريم — نسخة $TAG" --notes "نسخة أندرويد أصلية 100% (بلا WebView للميزات الأساسية) — موقّعة بمفتاح ثابت." -R "$GITHUB_REPOSITORY"
          fi
