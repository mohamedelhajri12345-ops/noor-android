name: Build NOOR APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOOR-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0-debug"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" app/build/outputs/apk/debug/app-debug.apk --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk --title "NOOR - Debug APK" --notes "نسخة تجريبية أندرويد أصلية 100% (بلا WebView)" -R "$GITHUB_REPOSITORY"
          fi
