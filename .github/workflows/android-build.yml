name: Build NOOR APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ═══ مفتاح توقيع ثابت — يُولَّد مرة واحدة فقط، ثم يُحفظ في المستودع ═══
      # هذا يضمن أن كل نسخة قادمة موقّعة بنفس المفتاح، فلا يفشل التثبيت أبداً
      # عند تحديث التطبيق فوق نسخة قديمة (خطأ "signatures do not match").
      - name: Ensure signing keystore exists
        run: |
          if [ ! -f app/noor-release.keystore ]; then
            echo "لا يوجد مفتاح توقيع — يتم توليد مفتاح ثابت جديد الآن..."
            keytool -genkeypair -v \
              -keystore app/noor-release.keystore \
              -alias noorkey \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass NoorSecure2026 -keypass NoorSecure2026 \
              -dname "CN=NOOR, OU=NOOR, O=ElHajri, L=Casablanca, S=Casablanca, C=MA"
            git config user.name "NOOR CI"
            git config user.email "ci@noor.local"
            git add app/noor-release.keystore
            git commit -m "إضافة مفتاح التوقيع الثابت (يُستعمل في كل الإصدارات القادمة)"
            git push
          else
            echo "مفتاح التوقيع موجود — سيُستعمل لتوقيع هذا الإصدار."
          fi

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true   # خدمة كاش GitHub متقلبة اليوم — البناء بدون كاش أضمن

      # ═══ إصدار الإنتاج: نسخة Release موقّعة بالمفتاح الثابت ═══
      - name: Build Release APK + AAB
        run: |
          set -o pipefail
          gradle assembleRelease bundleRelease --no-daemon --stacktrace 2>&1 | tee build-output.log
      # عند الفشل: انشر سجل الأخطاء في فرع ci-errors كي يمكن قراءته بدون صلاحيات إدارية
      - name: Publish build errors (on failure)
        if: failure()
        run: |
          mkdir -p err
          grep -B2 -A8 "error:\|e: \|FAILURE\|Unresolved" build-output.log | tail -n 200 > err/build-error.txt || tail -n 100 build-output.log > err/build-error.txt
          echo "Build failed at $(date -u)" >> err/build-error.txt
          git config user.name "NOOR CI"
          git config user.email "ci@noor.local"
          git checkout --orphan ci-errors 2>/dev/null || git checkout ci-errors
          git rm -rf --cached . -q 2>/dev/null || true
          cp err/build-error.txt /tmp/build-error.txt
          git checkout main -- .github 2>/dev/null || true
          git checkout --orphan ci-errors2 2>/dev/null
          cd /tmp && mkdir -p cierr && cp build-error.txt cierr/
          cd cierr && git init -q && git checkout -q -b main 2>/dev/null
          git -C /tmp/cierr remote add origin "https://x-access-token:${GH_TOKEN}@github.com/$GITHUB_REPOSITORY.git" 2>/dev/null || git -C /tmp/cierr remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/$GITHUB_REPOSITORY.git"
          git -C /tmp/cierr add build-error.txt
          git -C /tmp/cierr -c user.name="NOOR CI" -c user.email="ci@noor.local" commit -q -m "build errors $(date -u +%Y%m%d%H%M%S)"
          git -C /tmp/cierr push -q -f origin main:ci-errors
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version name
        id: ver
        run: |
          VNAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "name=v$VNAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOOR-release-APK
          path: app/build/outputs/apk/release/*arm64*.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOOR-release-AAB
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Publish APK + AAB as Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.name }}"
          APK_NAME="noor-${TAG}.apk"
          AAB_NAME="noor-${TAG}.aab"
          cp app/build/outputs/apk/release/*arm64*-release.apk "$APK_NAME"
          cp app/build/outputs/bundle/release/app-release.aab "$AAB_NAME"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" "$AAB_NAME" --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK_NAME" "$AAB_NAME" --title "القرآن الكريم — نسخة $TAG" --notes "نسخة إنتاج Release موقّعة بمفتاح ثابت: ناتيف كامل + ذكاء اصطناعي محلي + ويب فيو فوري يعمل دون إنترنت. AAB مرفق لنشر Google Play." -R "$GITHUB_REPOSITORY"
          fi
